[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipewire-controller"
version = "2.0.0"
description = "PipeWire Audio Control Center — DAW Companion for Linux"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Andrianos Papamarkou" }]
keywords = ["pipewire", "audio", "linux", "daw", "system-tray", "jack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["PyQt6>=6.4", "numpy>=1.24"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "black",
    "build",
    "mypy",
]

[project.scripts]
pipewire-controller = "pipewire_controller.__main__:main"

[project.urls]
Homepage = "https://github.com/apapamarkou/pipewire-controller"
Issues = "https://github.com/apapamarkou/pipewire-controller/issues"

[tool.hatch.build]
packages = ["src/pipewire_controller"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipewire_controller"]
include = [
    "src/pipewire_controller/resources",
    "src/pipewire_controller/resources/**",
    "src/pipewire_controller/text",
    "src/pipewire_controller/text/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/pipewire_controller/resources",
    "src/pipewire_controller/resources/**",
    "src/pipewire_controller/text",
    "src/pipewire_controller/text/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
